[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "fire-track2"
version = "0.1.0"
description = "Verification and execution foundation for multiregion aerial water-drop simulations"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=2.1,<3"]

[project.optional-dependencies]
visualization = ["pyvista>=0.49,<0.50"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/aerial_drop"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
