name: Analytical and tooling checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install uv
        run: python -m pip install uv==0.11.14
      - name: Install locked dependencies
        run: make setup
      - name: Check analytical foundations and tooling
        run: make check
      - name: Run E0 verification
        run: make e0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e0-verification
          path: results/runs/
